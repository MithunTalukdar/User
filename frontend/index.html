<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Resume Builder — Professional Resume Content Generator</title>
    <meta
      name="description"
      content="Generate professional HR summaries, cover letters, LinkedIn summaries, career objectives and more in seconds with AI. Build, refine and export your resume content."

    />
    <script>
      ;(function () {
        var stored = localStorage.getItem('rb_theme')
        var dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      })()
    </script>
